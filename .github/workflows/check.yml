# The free robot tester (the owner's ask, Nov 22 20:12Z: fewer bugs for less usage). On every pull request GitHub runs
# the quick checks (the page loads, no undefined names, the code health ratchet with ESLint and copies) on its own
# computers, so a broken PR shows a red X before it is merged. Once a day it runs the whole check list (about 25
# minutes), the owner's "full run once a day in the background, never blocking". Run by hand: Actions → Checks →
# Run workflow, with test names (blank = all).
name: Checks
on:
  pull_request:
    paths-ignore:
      - "notes/**"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      tests:
        description: "Test names, space separated (blank runs every check)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get Playwright and Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run the checks
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          TESTS: ${{ github.event_name == 'pull_request' && 'load undef' || github.event.inputs.tests }}
        run: node tools/check/run.mjs $TESTS
