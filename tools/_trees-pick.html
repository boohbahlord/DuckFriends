<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Downpour trees: pick one</title>
    <style>
      body {
        background: #101016;
        color: #e8e8f0;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 18px;
        width: 1560px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      figure {
        margin: 0;
        background: #1d1e29;
        border-radius: 8px;
        padding: 10px;
        display: grid;
        gap: 6px;
        justify-items: center;
      }
      figure.wide {
        grid-column: 1 / -1;
      }
      figcaption {
        font-size: 15px;
        text-align: center;
        line-height: 1.3;
      }
      figcaption b {
        font-size: 17px;
      }
      .px img {
        image-rendering: pixelated;
        display: block;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
        font-size: 15px;
        color: #b9bacb;
      }
    </style>
  </head>
  <body>
    <h1>Downpour trees: A, B and D with no drapes, three of each</h1>
    <p>
      Each next to a duck at true size, on the map's own grass, at night, as the
      game's pixels. Each is about 3 ducks tall, and the map can flip any of
      them.
    </p>
    <div class="grid" id="g"></div>
    <script type="module">
      import { pxSVG } from "../js/pixel.js";
      import { duckSVG } from "../js/duck.js";
      import { swampTreeSVG, SWAMP_TREE } from "../js/hangout/stationart.js";
      import * as T from "./_trees-draft.js";
      const PH = 290,
        ZOOM = 1.35; // (a panel's height in world px; the page's zoom on the game's pixels)
      const rng = (seed) => () =>
        (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
      /* the map's grass (dpground.js' grassTile colours), a few puddles */
      function ground(PW, seed) {
        const rr = rng(seed);
        let s = `<rect width="${PW}" height="${PH}" fill="#24331f"/>`;
        for (let i = 0; i < PW / 28; i++) {
          const rx = 20 + rr() * 50;
          s += `<ellipse cx="${rr() * PW}" cy="${rr() * PH}" rx="${rx}" ry="${rx * 0.5}" fill="${rr() < 0.5 ? "#1b2817" : "#2c3d24"}" opacity=".7"/>`;
        }
        for (let i = 0; i < PW / 70; i++) {
          const rx = 14 + rr() * 26;
          s += `<ellipse cx="${rr() * PW}" cy="${rr() * PH}" rx="${rx}" ry="${rx * 0.45}" fill="#33291d" opacity=".55"/>`;
        }
        let p = "";
        for (let i = 0; i < PW / 6; i++) {
          const x = rr() * PW,
            y = 12 + rr() * PH,
            l = 5 + rr() * 7;
          p += `M${x} ${y}l-3 ${-l}M${x} ${y}l0.5 ${-l - 2}M${x} ${y}l3 ${-l + 1}`;
        }
        s += `<path d="${p}" stroke="#3b5230" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>`;
        for (let i = 0; i < PW / 160; i++) {
          const x = rr() * PW,
            y = 160 + rr() * 190,
            rx = 26 + rr() * 30,
            ry = 7 + rr() * 6;
          s += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#1c2a2c"/><ellipse cx="${x - rx * 0.2}" cy="${y - ry * 0.25}" rx="${rx * 0.35}" ry="${ry * 0.2}" fill="#5a7280" opacity=".45"/>`;
        }
        return s;
      }
      function rain(PW, seed) {
        const rr = rng(seed + 9);
        let s = "";
        for (let i = 0; i < PW / 5; i++) {
          const x = rr() * PW,
            y = rr() * PH;
          s += `<path d="M${x} ${y}l-5 16" stroke="#565d77" stroke-width="2"/>`;
        }
        return s;
      }
      const duck = (x, gy, color = "#ffd23f") => ({
        y: gy,
        s: `<g transform="translate(${x - 32} ${gy - 58})">${duckSVG({ color }, { size: 64, shadow: true })}</g>`,
      });
      const tree = (t, x, gy) => ({
        y: gy,
        s: t.svg.replace(
          "<svg",
          `<svg x="${x - t.w / 2}" y="${gy - (t.h - t.foot)}"`,
        ),
      });
      /* a panel: ground, then everything sorted by its foot, then the night over it, then the rain */
      function panel(PW, things, seed) {
        things.sort((a, b) => a.y - b.y);
        return `<svg viewBox="0 0 ${PW} ${PH}" width="${PW}" height="${PH}" xmlns="http://www.w3.org/2000/svg">${ground(PW, seed)}${things.map((t) => t.s).join("")}<rect width="${PW}" height="${PH}" fill="#05070f" opacity=".28"/>${rain(PW, seed)}</svg>`;
      }
      const old = (k, s) => ({
        svg: swampTreeSVG(k, s),
        w: SWAMP_TREE.w,
        h: SWAMP_TREE.h,
        foot: SWAMP_TREE.foot,
      });
      const PW = 380,
        GY = PH - 34;
      const single = (t) => [duck(PW * 0.14, GY), tree(t, PW * 0.6, GY)];
      const NAMES = {
        cypress: [
          "A. Bald cypress",
          ["three pads", "two pads, long bare trunk", "young, four small pads"],
        ],
        oak: [
          "B. Live oak",
          ["even", "leaning one way", "smaller, taller dome"],
        ],
        willow: [
          "D. Willow, no drapes",
          ["wide, drooping sides", "taller, narrower", "two trunks"],
        ],
      };
      const items = [];
      for (const [k, [name, vs]] of Object.entries(NAMES))
        vs.forEach((what, v) =>
          items.push([
            PW,
            single(T[k](v + 1, v)),
            `<b>${name} ${v + 1}</b>: ${what}`,
          ]),
        );
      document.getElementById("g").innerHTML = items
        .map(([w, things, cap], i) => {
          const svg = panel(w, things, 11 + i * 7);
          return `<figure class="${w > PW ? "wide" : ""}"><div class="px" style="width:${w * ZOOM}px">${pxSVG(svg, w / 1.4).replace("<img", `<img style="width:${w * ZOOM}px;height:auto"`)}</div><figcaption>${cap}</figcaption></figure>`;
        })
        .join("");
    </script>
  </body>
</html>
