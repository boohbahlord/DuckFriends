<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Downpour trees: pick one</title>
    <style>
      body {
        background: #101016;
        color: #e8e8f0;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 18px;
        width: 1560px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      figure {
        margin: 0;
        background: #1d1e29;
        border-radius: 8px;
        padding: 10px;
        display: grid;
        gap: 6px;
        justify-items: center;
      }
      figure.wide {
        grid-column: 1 / -1;
      }
      figcaption {
        font-size: 15px;
        text-align: center;
        line-height: 1.3;
      }
      figcaption b {
        font-size: 17px;
      }
      .px img {
        image-rendering: pixelated;
        display: block;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
        font-size: 15px;
        color: #b9bacb;
      }
    </style>
  </head>
  <body>
    <h1>Downpour trees: the two in the map now, then 4 new kinds</h1>
    <p>
      Each next to a duck at true size, on the map's own grass, at night, as the
      game's pixels. The new ones are about 3 ducks tall (the old ones are 5).
    </p>
    <div class="grid" id="g"></div>
    <script type="module">
      import { pxSVG } from "../js/pixel.js";
      import { duckSVG } from "../js/duck.js";
      import { swampTreeSVG, SWAMP_TREE } from "../js/hangout/stationart.js";
      import * as T from "./_trees-draft.js";
      const PH = 360,
        ZOOM = 1.35; // (a panel's height in world px; the page's zoom on the game's pixels)
      const rng = (seed) => () =>
        (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
      /* the map's grass (dpground.js' grassTile colours), a few puddles */
      function ground(PW, seed) {
        const rr = rng(seed);
        let s = `<rect width="${PW}" height="${PH}" fill="#24331f"/>`;
        for (let i = 0; i < PW / 28; i++) {
          const rx = 20 + rr() * 50;
          s += `<ellipse cx="${rr() * PW}" cy="${rr() * PH}" rx="${rx}" ry="${rx * 0.5}" fill="${rr() < 0.5 ? "#1b2817" : "#2c3d24"}" opacity=".7"/>`;
        }
        for (let i = 0; i < PW / 70; i++) {
          const rx = 14 + rr() * 26;
          s += `<ellipse cx="${rr() * PW}" cy="${rr() * PH}" rx="${rx}" ry="${rx * 0.45}" fill="#33291d" opacity=".55"/>`;
        }
        let p = "";
        for (let i = 0; i < PW / 6; i++) {
          const x = rr() * PW,
            y = 12 + rr() * PH,
            l = 5 + rr() * 7;
          p += `M${x} ${y}l-3 ${-l}M${x} ${y}l0.5 ${-l - 2}M${x} ${y}l3 ${-l + 1}`;
        }
        s += `<path d="${p}" stroke="#3b5230" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>`;
        for (let i = 0; i < PW / 160; i++) {
          const x = rr() * PW,
            y = 160 + rr() * 190,
            rx = 26 + rr() * 30,
            ry = 7 + rr() * 6;
          s += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#1c2a2c"/><ellipse cx="${x - rx * 0.2}" cy="${y - ry * 0.25}" rx="${rx * 0.35}" ry="${ry * 0.2}" fill="#5a7280" opacity=".45"/>`;
        }
        return s;
      }
      function rain(PW, seed) {
        const rr = rng(seed + 9);
        let s = "";
        for (let i = 0; i < PW / 5; i++) {
          const x = rr() * PW,
            y = rr() * PH;
          s += `<path d="M${x} ${y}l-5 16" stroke="#565d77" stroke-width="2"/>`;
        }
        return s;
      }
      const duck = (x, gy, color = "#ffd23f") => ({
        y: gy,
        s: `<g transform="translate(${x - 32} ${gy - 58})">${duckSVG({ color }, { size: 64, shadow: true })}</g>`,
      });
      const tree = (t, x, gy) => ({
        y: gy,
        s: t.svg.replace(
          "<svg",
          `<svg x="${x - t.w / 2}" y="${gy - (t.h - t.foot)}"`,
        ),
      });
      /* a panel: ground, then everything sorted by its foot, then the night over it, then the rain */
      function panel(PW, things, seed) {
        things.sort((a, b) => a.y - b.y);
        return `<svg viewBox="0 0 ${PW} ${PH}" width="${PW}" height="${PH}" xmlns="http://www.w3.org/2000/svg">${ground(PW, seed)}${things.map((t) => t.s).join("")}<rect width="${PW}" height="${PH}" fill="#05070f" opacity=".28"/>${rain(PW, seed)}</svg>`;
      }
      const old = (k, s) => ({
        svg: swampTreeSVG(k, s),
        w: SWAMP_TREE.w,
        h: SWAMP_TREE.h,
        foot: SWAMP_TREE.foot,
      });
      const PW = 380,
        GY = 320;
      const single = (t) => [duck(PW * 0.14, GY), tree(t, PW * 0.6, GY)];
      const items = [
        [PW, single(old(0, 1)), "<b>Now</b>: the cypress in the map"],
        [PW, single(old(1, 2)), "<b>Now</b>: the oak in the map"],
        [
          PW,
          single(T.cypress(1)),
          "<b>A. Bald cypress</b>: tall, thin, flat pads of leaves, knees at its foot",
        ],
        [
          PW,
          single(T.oak(1)),
          "<b>B. Live oak</b>: low and wide, big limbs, heavy moss",
        ],
        [
          PW,
          single(T.snag(1)),
          "<b>C. Dead snag</b>: bleached grey, snapped top, hides nothing",
        ],
        [
          PW,
          single(T.willow(1)),
          "<b>D. Weeping willow</b>: round head, long drapes, trunk showing",
        ],
      ];
      /* the grove: all four mixed, some flipped, the way they'd stand along the swamp's edge */
      const GW = 1100;
      items.push([
        GW,
        [
          tree(T.cypress(2), 80, 250),
          tree(T.willow(2, true), 240, 300),
          tree(T.snag(2), 380, 230),
          tree(T.oak(2, true), 560, 330),
          tree(T.cypress(3, true), 720, 240),
          tree(T.snag(3, true), 830, 330),
          tree(T.willow(3), 960, 260),
          tree(T.cypress(4), 1045, 320),
          duck(430, 300),
          duck(660, 236, "#7fd3ff"),
          duck(900, 344, "#ff8fb1"),
        ],
        "<b>All four mixed</b>, some flipped: how a stretch of the swamp could look",
      ]);
      document.getElementById("g").innerHTML = items
        .map(([w, things, cap], i) => {
          const svg = panel(w, things, 11 + i * 7);
          return `<figure class="${w > PW ? "wide" : ""}"><div class="px" style="width:${w * ZOOM}px">${pxSVG(svg, w / 1.4).replace("<img", `<img style="width:${w * ZOOM}px;height:auto"`)}</div><figcaption>${cap}</figcaption></figure>`;
        })
        .join("");
    </script>
  </body>
</html>
