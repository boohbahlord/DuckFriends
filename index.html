    <script>
      /* the way out of a stuck start. The game is 160-odd files; if one of them doesn't arrive (a hiccup on the way, or
         a broken copy kept by the browser), the game never starts and the loading bar waits forever, and a refresh
         takes the same copies again. So: if the game hasn't started (main.js sets window.dfStarted) when a file fails,
         or after 20 s, I fetch every game file fresh from the site, drop the app's service worker and load the page
         again, twice at most. After that the bar says so and a tap tries again. */
      (function () {
        var KEY = "df-retry",
          done = false;
        var tries = function (n) {
          try {
            if (n === undefined) return +sessionStorage.getItem(KEY) || 0;
            sessionStorage.setItem(KEY, n);
          } catch (e) {}
          return n || 0;
        };
        var fresh = function () {
          var m = document.querySelector('script[type="importmap"]'),
            urls = ["./js/main.js"];
          try {
            var im = JSON.parse(m.textContent).imports;
            for (var k in im) urls.push(im[k]);
          } catch (e) {}
          urls.push(document.querySelector('script[type="module"]').src);
          return Promise.all(
            urls.map(function (u) {
              return fetch(u, { cache: "reload" }).catch(function () {});
            }),
          );
        };
        var noWorker = function () {
          var sw = navigator.serviceWorker;
          if (!sw || !sw.getRegistrations) return Promise.resolve();
          return sw.getRegistrations().then(function (rs) {
            return Promise.all(
              rs.map(function (r) {
                return r.unregister();
              }),
            );
          });
        };
        var retry = function () {
          var go = function () {
            location.reload();
          };
          Promise.all([fresh(), noWorker().catch(function () {})]).then(go, go);
        };
        var stuck = function () {
          if (window.dfStarted || done) return;
          done = true;
          var n = tries();
          if (n < 2) {
            tries(n + 1);
            return retry();
          }
          var p = document.querySelector(".veil-ping");
          if (!p) return;
          p.textContent = "Duck Friends didn't load. Tap to try again.";
          p.style.cursor = "pointer";
          document.querySelector(".veil").onclick = function () {
            tries(0);
            p.textContent = "Loading again …";
            retry();
          };
        };
        addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT") setTimeout(stuck, 300);
          },
          true,
        );
        setTimeout(stuck, 20000);
      })();
    </script>
