    <script>
      /* the way out of a stuck start. The game is 160-odd files; if one of them doesn't arrive (a hiccup on the way, or
         a broken copy kept by the browser), the game never starts and the loading bar waits forever, and a refresh
         takes the same copies again. So: if the game hasn't started (main.js sets window.dfStarted) when a file fails,
         or after 20 s, I fetch every game file fresh from the site, drop the app's service worker and load the page
         again, twice at most. After that the bar says so and a tap tries again. */
      (function () {
        var KEY = "df-retry",
          done = false,
          bad = [],
          oops = "";
        /* what went wrong, to show on the screen if it never starts: a file that didn't arrive, or the first error */
        addEventListener("error", function (e) {
          if (!oops && e.message)
            oops =
              e.message +
              " (" +
              String(e.filename || "")
                .replace(/^.*\//, "")
                .replace(/\?.*$/, "") +
              ":" +
              e.lineno +
              ")";
        });
        addEventListener("unhandledrejection", function (e) {
          if (!oops) oops = String((e.reason && e.reason.message) || e.reason);
        });
        var tries = function (n) {
          try {
            if (n === undefined) return +sessionStorage.getItem(KEY) || 0;
            sessionStorage.setItem(KEY, n);
          } catch (e) {}
          return n || 0;
        };
        var fresh = function () {
          var m = document.querySelector('script[type="importmap"]'),
            urls = ["./js/main.js"];
          try {
            var im = JSON.parse(m.textContent).imports;
            for (var k in im) urls.push(im[k]);
          } catch (e) {}
          urls.push(document.querySelector('script[type="module"]').src);
          bad = [];
          /* six at a time, and a busy answer (5xx) once more after a second: all at once, GitHub Pages answers 503 */
          var one = function (u, again) {
            var name = u.replace(/^.*?\/js\//, "js/").replace(/\?.*$/, "");
            return fetch(u, { cache: "reload" }).then(
              function (r) {
                if (r.status >= 500 && again)
                  return new Promise(function (ok) {
                    setTimeout(ok, 1000);
                  }).then(function () {
                    return one(u, false);
                  });
                if (!r.ok) bad.push(name + " (" + r.status + ")");
              },
              function () {
                bad.push(name + " (blocked)");
              },
            );
          };
          var i = 0;
          var lane = function () {
            if (i >= urls.length) return Promise.resolve();
            return one(urls[i++], true).then(lane);
          };
          return Promise.all([lane(), lane(), lane(), lane(), lane(), lane()]);
        };
        /* (with no connection the worker stays: it holds Single Player's copy of the game, sw.js) */
        var noWorker = function () {
          var sw = navigator.serviceWorker;
          if (!sw || !sw.getRegistrations || navigator.onLine === false)
            return Promise.resolve();
          return sw.getRegistrations().then(function (rs) {
            return Promise.all(
              rs.map(function (r) {
                return r.unregister();
              }),
            );
          });
        };
        var retry = function () {
          var go = function () {
            location.reload();
          };
          Promise.all([fresh(), noWorker().catch(function () {})]).then(go, go);
        };
        var stuck = function () {
          if (window.dfStarted || done) return;
          done = true;
          var n = tries();
          if (n < 2) {
            tries(n + 1);
            return retry();
          }
          var p = document.querySelector(".veil-ping");
          if (!p) return;
          p.textContent = "Duck Friends didn't load. Tap to try again.";
          p.style.cursor = "pointer";
          /* and why, small under it (the files are checked once more first) */
          fresh().then(function () {
            var why = bad.length
              ? "Not arriving: " + bad.slice(0, 4).join(", ")
              : oops || "No file failed: an add-on may be stopping the page";
            var w = document.createElement("small");
            w.className = "veil-why";
            w.style.cssText =
              "display:block;margin-top:.6rem;opacity:.75;font-size:.8rem;max-width:90vw;user-select:text";
            w.textContent = why;
            p.appendChild(w);
          });
          document.querySelector(".veil").onclick = function () {
            tries(0);
            p.textContent = "Loading again …";
            retry();
          };
        };
        addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT") setTimeout(stuck, 300);
          },
          true,
        );
        setTimeout(stuck, 20000);
      })();
    </script>
